# Set everything to be logged to the console
rootLogger.level = INFO
rootLogger.appenderRef.stdout.ref = console

# Console appender
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Settings to quiet third party logs
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = WARN
logger.jetty.additivity = false
logger.jetty.appenderRef.console.ref = console

logger.replexprtyper.name = org.apache.spark.repl.SparkIMain$exprTyper
logger.replexprtyper.level = INFO
logger.replexprtyper.additivity = false
logger.replexprtyper.appenderRef.console.ref = console

logger.replsparkimain.name = org.apache.spark.repl.SparkIMain
logger.replsparkimain.level = INFO
logger.replsparkimain.additivity = false
logger.replsparkimain.appenderRef.console.ref = console

logger.parquet.name = org.apache.parquet
logger.parquet.level = ERROR
logger.parquet.additivity = false
logger.parquet.appenderRef.console.ref = console

logger.delta.name = io.delta
logger.delta.level = INFO
logger.delta.additivity = false
logger.delta.appenderRef.console.ref = console
