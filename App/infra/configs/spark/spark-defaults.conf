# Spark Configuration for Delta Lake
# ===========================================

# Delta Lake Configuration
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.retentionDurationCheck.enabled=false
spark.databricks.delta.schema.autoMerge.enabled=true

# Memory Configuration
spark.driver.memory=2g
spark.executor.memory=2g
spark.executor.cores=2
spark.driver.maxResultSize=1g

# Storage Configuration
spark.hadoop.fs.defaultFS=hdfs://namenode:8020
spark.eventLog.enabled=true
spark.eventLog.dir=hdfs://namenode:8020/spark-logs
spark.history.fs.logDirectory=hdfs://namenode:8020/spark-logs

# Kafka Integration
spark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,io.delta:delta-core_2.12:3.0.0,org.apache.hadoop:hadoop-aws:3.3.4

# Dynamic Allocation
spark.dynamicAllocation.enabled=true
spark.dynamicAllocation.minExecutors=1
spark.dynamicAllocation.maxExecutors=4
spark.dynamicAllocation.initialExecutors=2

# Shuffle Configuration
spark.shuffle.service.enabled=true
spark.sql.shuffle.partitions=200

# Serialization
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryo.registrationRequired=false

# UI Configuration
spark.ui.enabled=true
spark.ui.port=4040

# Hive Metastore Configuration
# spark.sql.warehouse.dir=hdfs://namenode:8020/user/hive/warehouse
# spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083

# Network Configuration
spark.network.timeout=600s
spark.executor.heartbeatInterval=60s

# Checkpointing
spark.sql.streaming.checkpointLocation=hdfs://namenode:8020/spark-checkpoints
