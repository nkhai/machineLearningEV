<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Dashboard</title>
    <style>
        body { 
            background-color: #000000; 
            font-family: Arial, sans-serif; 
            color: #ffffff; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        .main-container {
            background-color: #0f1112;
            width: 1050px;
            height: 450px;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            padding: 30px;
            display: flex;
            flex-direction: row;
            border: 1px solid #333;
            position: relative;
        }

        /* Buttons & Badges */
        .label-btn {
            position: absolute; top: 20px; left: 20px;
            background-color: #76c65e; color: #000;
            border: none; border-radius: 8px; padding: 8px 15px;
            font-weight: bold; cursor: pointer; z-index: 10;
            transition: all 0.3s ease;
        }

        .status-box {
            position: absolute; top: 20px; right: 20px;
            border-radius: 5px; padding: 8px 20px;
            z-index: 10; display: flex; align-items: center; justify-content: center;
            border: 1px solid #333; min-width: 100px;
            transition: all 0.3s ease;
        }

        /* Panels */
        .left-panel { width: 35%; position: relative; height: 100%; }
        .right-panel { width: 65%; padding-left: 30px; display: flex; flex-direction: column; height: 100%; }

        /* SVG Speed Gauge */
        .gauge-wrapper {
            position: relative; width: 260px; height: 260px; margin: 10px auto 0;
        }
        .gauge-svg { transform: rotate(135deg); width: 100%; height: 100%; }
        .speed-overlay {
            text-align: center; width: 100%; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -20%);
            z-index: 5;
        }
        
        .vehicle-info {
            position: absolute; bottom: 0; left: 10px; font-size: 14px;
        }

        /* Stats Grid */
        .stats-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 60px; padding-bottom: 20px;
        }
        
        .info-col { width: 180px; }
        .info-box {
            background-color: #141618; border-radius: 12px;
            padding: 12px 15px; margin-bottom: 12px;
            border: 1px solid #222;
        }
        .info-label { color: #6e7f8d; font-size: 14px; }
        .info-value-wrap { margin-top: 2px; display: flex; align-items: baseline; }
        .info-val { color: white; font-weight: bold; font-size: 16px; margin-right: 5px; }
        .info-unit { color: #00f2ff; font-size: 14px; }
        .info-bar { height: 3px; width: 40px; background-color: #00f2ff; border-radius: 2px; margin-top: 6px; }

        /* Battery Visual */
        .soc-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .battery-outer {
            width: 70px; height: 35px; border: 2px solid #aaa; border-radius: 6px; 
            padding: 2px; display: flex; margin-bottom: 15px; position: relative;
        }
        .battery-inner {
            width: 0%; height: 100%; background: linear-gradient(to right, #76c65e, #a8e063); 
            border-radius: 2px; transition: width 0.3s ease;
        }
        .battery-nub {
            position: absolute; right: -6px; top: 8px; width: 4px; height: 14px; 
            background-color: #aaa; border-top-right-radius: 3px; border-bottom-right-radius: 3px;
        }

        /* Trend Box */
        .trend-container { margin-top: auto; }
    </style>
</head>
<body>
    <div class="main-container">
        <button id="labelBtn" class="label-btn">00</button>

        <div id="statusBox" class="status-box">
            <span style="color: white; font-weight: bold;">WAITING...</span>
        </div>

        <div class="left-panel">
            <div class="gauge-wrapper">
                <svg class="gauge-svg" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#222" stroke-width="6"
                        stroke-dasharray="235.6 314.16" stroke-linecap="round"/>
                    
                    <circle id="gaugeArc" cx="60" cy="60" r="50" fill="none" stroke="#56a64b" stroke-width="6"
                        stroke-dasharray="0 314.16" stroke-linecap="round"
                        style="transition: stroke-dasharray 0.3s ease, stroke 0.3s ease;"/>
                </svg>
                <div class="speed-overlay">
                    <div id="speedDisplay" style="font-size: 80px; font-weight: bold; line-height: 1; text-shadow: 0 0 10px rgba(255,255,255,0.5);">0</div>
                    <div style="font-size: 18px; color: #aaa; margin-top: 5px; text-transform: uppercase;">km/h</div>
                </div>
            </div>

            <div class="vehicle-info">
                <div style="font-size: 20px; color: #aaa;">
                    <span style="color: #666;">Car ID:</span>
                    <span id="displayCarId" style="font-weight: bold; color: white;">--</span>
                </div>
                <div style="font-size: 13px; color: #aaa; margin-top: 4px;">
                    <span style="color: #666;">Car Name:</span>
                    <span id="displayCarName">--</span>
                </div>
                <div style="font-size: 11px; color: #aaa; margin-top: 2px;">
                    <span style="color: #666;">VIN:</span>
                    <span id="displayVin">--</span>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="stats-row">
                <div class="info-col">
                    <div class="info-box">
                        <div class="info-label">Voltage:</div>
                        <div class="info-value-wrap"><span id="voltVal" class="info-val">0</span><span class="info-unit">V</span></div>
                        <div class="info-bar"></div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Current:</div>
                        <div class="info-value-wrap"><span id="currentVal" class="info-val">0</span><span class="info-unit">A</span></div>
                        <div class="info-bar"></div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Capacity:</div>
                        <div class="info-value-wrap"><span id="capacityVal" class="info-val">0</span><span class="info-unit">Ah</span></div>
                        <div class="info-bar"></div>
                    </div>
                </div>

                <div class="soc-col">
                    <div class="battery-outer">
                        <div id="batteryFill" class="battery-inner"></div>
                        <div class="battery-nub"></div>
                    </div>
                    <div style="display: flex; align-items: baseline;">
                        <span style="color: #aaa; font-size: 30px; margin-right: 15px;">SOC:</span>
                        <span id="socVal" style="color: white; font-size: 35px; font-weight: bold;">0%</span>
                    </div>
                </div>

                <div class="info-col">
                    <div class="info-box">
                        <div class="info-label">Max Temp:</div>
                        <div class="info-value-wrap"><span id="maxTempVal" class="info-val">0</span><span class="info-unit">°C</span></div>
                        <div class="info-bar"></div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Min Temp:</div>
                        <div class="info-value-wrap"><span id="minTempVal" class="info-val">0</span><span class="info-unit">°C</span></div>
                        <div class="info-bar"></div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Mileage:</div>
                        <div class="info-value-wrap"><span id="mileageVal" class="info-val">0</span><span class="info-unit">km</span></div>
                        <div class="info-bar"></div>
                    </div>
                </div>
            </div>

            <div class="trend-container">
                <div style="color: white; font-size: 14px; font-weight: bold; margin-bottom: 5px;">Voltage Trend</div>
                <canvas id="trendChart" width="600" height="80" style="width: 100%;"></canvas>
                <div style="display: flex; align-items: center; margin-top: -5px;">
                    <div style="flex: 1; height: 1px; background-color: #00f2ff;"></div>
                    <div id="timestampVal" style="color: #666; font-size: 10px; margin-left: 10px;">Timestamp: 0.0</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/user.js"></script>
</body>
</html>
